<!-- SFI chat assistant: opens in a native <dialog>; talks to /api/sfi/chat -->
<button class="ocs__btn accent fill" id="chatFab" aria-label="Open chat assistant">💬 Ask the SFI Assistant</button>

<dialog id="chatWindow" aria-label="SFI Specs Assistant">
  <div class="ocs__card">
    <h2 class="ocs__section-title">SFI Specs Assistant</h2>
    <p class="ocs__description">Online specification help</p>
    <div id="chatMessages">
      <div class="ocs__callout">
        Ask about motorsport safety certifications, spec numbers, or which parts need SFI certification.
      </div>
    </div>
    <p class="ocs__text" id="chatTyping" hidden>Typing&hellip;</p>
    <div class="ocs__links">
      <input class="ocs__input" type="text" id="chatInput" placeholder="Ask about SFI specs..." autocomplete="off">
      <button class="ocs__btn accent fill" id="chatSend" aria-label="Send message">Send</button>
      <button class="ocs__btn" id="chatClose" aria-label="Close chat">Close</button>
    </div>
  </div>
</dialog>

<script>
(function() {
  var CHAT_API = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
    ? 'http://localhost:8423/api/sfi/chat'
    : 'https://greppers-be.opencodingsociety.com/api/sfi/chat';

  var fab = document.getElementById('chatFab');
  var win = document.getElementById('chatWindow');
  var msgs = document.getElementById('chatMessages');
  var typingEl = document.getElementById('chatTyping');
  var input = document.getElementById('chatInput');
  var sendBtn = document.getElementById('chatSend');
  var history = [];
  var busy = false;

  fab.addEventListener('click', function() {
    win.showModal();
    input.focus();
  });
  document.getElementById('chatClose').addEventListener('click', function() { win.close(); });

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatReply(text) {
    // escapeHtml first neutralises all markup, then we apply safe formatting
    var safe = escapeHtml(text);
    safe = safe.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
    safe = safe.replace(/\n/g, '<br>');
    return safe;
  }

  function addMsg(text, role) {
    var div = document.createElement('div');
    div.className = role === 'bot' ? 'ocs__callout' : 'ocs__text';
    if (role === 'bot') {
      // Safe: text is escaped before formatting is applied
      div.innerHTML = formatReply(text);
    } else {
      div.textContent = text;
    }
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function send() {
    var text = input.value.trim();
    if (!text || busy) return;

    addMsg(text, 'user');
    history.push({ role: 'user', text: text });
    input.value = '';
    busy = true;
    sendBtn.disabled = true;
    typingEl.hidden = false;
    msgs.scrollTop = msgs.scrollHeight;

    fetch(CHAT_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: history.slice(0, -1) })
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.reply) {
        addMsg(data.reply, 'bot');
        history.push({ role: 'assistant', text: data.reply });
      } else {
        addMsg("Sorry, I couldn't get a response. Please try again.", 'bot');
      }
    })
    .catch(function() {
      addMsg("Connection error \u2014 is the backend running?", 'bot');
    })
    .finally(function() {
      busy = false;
      sendBtn.disabled = false;
      typingEl.hidden = true;
    });
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
})();
</script>
