{% assign photo = site.data.sfi_photography[include.key] %}
{% assign photo_base = '/images/sfi/photography/' | append: photo.id | append: '-' %}
<figure class="sfi-photograph{% if include.class %} {{ include.class | escape }}{% endif %}" data-photograph="{{ photo.id }}">
  <picture>
    <source type="image/webp" sizes="{{ include.sizes | default: '(max-width: 600px) calc(100vw - 32px), 480px' }}" srcset="{% for size in photo.widths %}{{ photo_base | append: size | append: '.webp' | relative_url }} {{ size }}w{% unless forloop.last %}, {% endunless %}{% endfor %}">
    <img src="{{ photo_base | append: photo.width | append: '.jpg' | relative_url }}" width="{{ photo.width }}" height="{{ photo.height }}" alt="{{ photo.alt | escape }}" loading="{{ include.loading | default: 'lazy' }}" decoding="async"{% if include.priority %} fetchpriority="high"{% endif %}>
  </picture>
  {% unless include.caption == false %}<figcaption>{{ photo.caption | escape }} <a href="{{ '/photo-credits/' | relative_url }}#{{ photo.id }}">Photo credit</a></figcaption>{% endunless %}
</figure>
