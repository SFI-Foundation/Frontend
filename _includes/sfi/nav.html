<nav class="sfi-nav" aria-label="Primary navigation">
  <div class="sfi-nav-inner">
    <a href="{{ '/' | relative_url }}" class="sfi-nav-brand"><span>SFI</span> Foundation</a>
    <button class="sfi-nav-toggle" id="navToggle" type="button" aria-controls="navLinks" aria-expanded="false" aria-label="Open navigation menu">
      <span class="sfi-nav-toggle-line"></span>
      <span class="sfi-nav-toggle-line"></span>
      <span class="sfi-nav-toggle-line"></span>
    </button>
    <ul class="sfi-nav-links" id="navLinks">
      <li><a href="{{ '/about/' | relative_url }}"{% if page.permalink == '/about/' %} class="active"{% endif %}>About</a></li>
      <li><a href="{{ '/history/' | relative_url }}"{% if page.permalink == '/history/' %} class="active"{% endif %}>History</a></li>
      <li><a href="{{ '/specs/' | relative_url }}"{% if page.permalink == '/specs/' %} class="active"{% endif %}>Specs</a></li>
      <li><a href="{{ '/services/' | relative_url }}"{% if page.permalink == '/services/' %} class="active"{% endif %}>Services</a></li>
      <li><a href="{{ '/contact/' | relative_url }}"{% if page.permalink == '/contact/' %} class="active"{% endif %}>Contact</a></li>
      <li><a href="{{ '/quiz/' | relative_url }}" class="sfi-nav-highlight{% if page.permalink == '/quiz/' %} active{% endif %}">My Gear</a></li>
      <li><a href="{{ '/detect/' | relative_url }}" class="sfi-nav-highlight{% if page.permalink == '/detect/' %} active{% endif %}">Detect</a></li>
      <li><a href="{{ '/sfi-specs/' | relative_url }}" class="sfi-nav-cta{% if page.permalink == '/sfi-specs/' %} active{% endif %}">Spec Search</a></li>
      <li id="navAuth"><a href="{{ '/login/' | relative_url }}" class="sfi-nav-auth-link">Sign In</a></li>
    </ul>
  </div>
</nav>

<script type="module">
import { pythonURI as AUTH_API, baseurl } from '{{ "/assets/js/api/config.js" | relative_url }}';
(function() {
  var navAuth = document.getElementById('navAuth');

  function setNavUser(user) {
    while (navAuth.firstChild) navAuth.removeChild(navAuth.firstChild);
    var a = document.createElement('a');
    a.href = baseurl + (user ? '/sfi-profile/' : '/login/');
    if (user) {
      a.className = 'sfi-nav-auth-avatar';
      var dot = document.createElement('span');
      dot.className = 'sfi-nav-auth-dot';
      a.appendChild(dot);
      var initial = (user.name || user.uid || '?')[0].toUpperCase();
      a.appendChild(document.createTextNode(initial));
    } else {
      a.className = 'sfi-nav-auth-link';
      a.textContent = 'Sign In';
    }
    navAuth.appendChild(a);
  }

  fetch(AUTH_API + '/api/id', { credentials: 'include', cache: 'no-store' })
    .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
    .then(function(data) { setNavUser(data); })
    .catch(function() { setNavUser(null); });

  window.addEventListener('sfi-auth', function(e) { setNavUser(e.detail); });
})();
</script>
