<header class="opencs-bar">
  <div class="opencs-bar__inner">
    <a class="opencs-bar__brand" href="{{ '/' | relative_url }}" aria-label="SFI Foundation home">
      <img src="{{ '/images/sfi/SFI-Logo.png' | relative_url }}" alt="" width="158" height="60">
    </a>
    <a class="sfi-settings-gear" href="{{ '/settings/' | relative_url }}" aria-label="Settings" title="Settings" data-i18n-label="Settings" data-i18n-title="Settings"{% if page.url == '/settings/' %} aria-current="page"{% endif %}>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9.5 3-.7 2.5-2 .9-2.4-.7-2 3.4 1.8 1.9v2l-1.8 1.9 2 3.4 2.4-.7 2 .9.7 2.5h4l.7-2.5 2-.9 2.4.7 2-3.4-1.8-1.9v-2l1.8-1.9-2-3.4-2.4.7-2-.9-.7-2.5z"/><circle cx="11.5" cy="12" r="3"/></svg>
    </a>
    <button id="navToggle" class="opencs-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="navLinks" hidden>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18" /></svg>
    </button>
    <nav id="navLinks" class="opencs-nav" aria-label="Primary navigation">
      {% for nav_path in site.minima.nav_pages %}
        {% assign nav_page = site.pages | where: 'path', nav_path | first %}
        {% if nav_page.title %}
        <a class="opencs-nav__link{% if nav_page.url == '/login/' %} opencs-nav__link--account{% endif %}" href="{{ nav_page.url | relative_url }}" data-i18n="{{ nav_page.nav_title | default: nav_page.title | escape }}"{% if page.url == nav_page.url %} aria-current="page"{% endif %}>{{ nav_page.nav_title | default: nav_page.title | escape }}</a>
        {% endif %}
      {% endfor %}
    </nav>
  </div>
</header>
