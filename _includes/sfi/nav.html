<header class="sfi-nav">
  <nav class="sfi-nav-inner" aria-label="Primary navigation">
    <a href="{{ '/' | relative_url }}" class="sfi-nav-brand" aria-label="SFI Foundation home">
      <img src="{{ '/images/sfi/SFI-Logo.png' | relative_url }}" alt="" width="64" height="40">
      <span>SFI Foundation</span>
    </a>
    <button class="sfi-nav-toggle" id="navToggle" type="button" aria-controls="navLinks" aria-expanded="false" aria-label="Open navigation menu" hidden>
      <span class="sfi-nav-toggle-line"></span><span class="sfi-nav-toggle-line"></span><span class="sfi-nav-toggle-line"></span>
    </button>
    <ul class="sfi-nav-links" id="navLinks">
      {% for nav_path in site.minima.nav_pages %}
        {% assign nav_page = site.pages | where: 'path', nav_path | first %}
        {% if nav_page.title %}
        <li><a href="{{ nav_page.url | relative_url }}"{% if page.url == nav_page.url %} class="active" aria-current="page"{% endif %}>{{ nav_page.nav_title | default: nav_page.title | escape }}</a></li>
        {% endif %}
      {% endfor %}
      <li id="navAuth"><a href="{{ '/login/' | relative_url }}" class="sfi-nav-auth-link"{% if page.url == '/login/' %} aria-current="page"{% endif %}>Sign In</a></li>
    </ul>
  </nav>
</header>

<script type="module">
import { pythonURI as AUTH_API, baseurl } from '{{ "/assets/js/api/config.js" | relative_url }}';
(function() {
  var navAuth = document.getElementById('navAuth');

  function setNavUser(user) {
    while (navAuth.firstChild) navAuth.removeChild(navAuth.firstChild);
    var a = document.createElement('a');
    a.href = baseurl + (user ? '/sfi-profile/' : '/login/');
    if (user) {
      a.className = 'sfi-nav-auth-avatar';
      a.setAttribute('aria-label', 'My profile');
      var dot = document.createElement('span');
      dot.className = 'sfi-nav-auth-dot';
      a.appendChild(dot);
      var initial = (user.name || user.uid || '?')[0].toUpperCase();
      a.appendChild(document.createTextNode(initial));
    } else {
      a.className = 'sfi-nav-auth-link';
      a.textContent = 'Sign In';
    }
    navAuth.appendChild(a);
  }

  fetch(AUTH_API + '/api/id', { credentials: 'include', cache: 'no-store' })
    .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
    .then(function(data) { setNavUser(data); })
    .catch(function() { setNavUser(null); });

  window.addEventListener('sfi-auth', function(e) { setNavUser(e.detail); });
})();
</script>
