<!-- Admin Panel launcher + dialog (native <dialog> supplies the overlay) -->
<button id="admin-toggle-btn" class="ocs__btn accent fill" aria-label="Open Admin Panel">⚙️ Admin</button>

<dialog id="admin-panel" aria-label="Admin panel">
  <div class="ocs__card">
    <h2 class="ocs__section-title">Admin Dashboard</h2>
    <div id="admin-container" class="ocs__text">
      <em>Loading admin data...</em>
    </div>
    <div class="ocs__links">
      <button id="admin-close-btn" class="ocs__btn" aria-label="Close Admin Panel">Close</button>
    </div>
  </div>
</dialog>

<script type="module">
  import { pythonURI, javaURI, fetchOptions } from '{{ site.baseurl }}/assets/js/api/config.js';

  // API base for the flask backend (localhost:8423 vs greppers-be in prod).
  // pythonURI from config.js already resolves to exactly that pair, and is the
  // host that serves /api/sfi/pdf-summary, so reuse it directly.
  const API_BASE = pythonURI;

  // Module-scope HTML escaper so summary render helpers (added at module scope)
  // can safely escape LLM/filename output without depending on the inner
  // escapeHtml defined inside the Admin block.
  function escapeHtmlSafe(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // Render a summary block: escape HTML and preserve newlines/bullets.
  function renderSummary(summaryText) {
    return `<div class="pdf-summary ocs__callout">${escapeHtmlSafe(summaryText)}</div>`;
  }

  // Lazily load pdf.js only when summarization is actually requested. A static
  // top-level import would break the whole admin panel if the CDN is blocked.
  let _pdfjsLibPromise = null;
  function loadPdfjs() {
    if (!_pdfjsLibPromise) {
      _pdfjsLibPromise = import('https://mozilla.github.io/pdf.js/build/pdf.mjs').then((lib) => {
        lib.GlobalWorkerOptions.workerSrc = 'https://mozilla.github.io/pdf.js/build/pdf.worker.mjs';
        return lib;
      });
    }
    return _pdfjsLibPromise;
  }

  // Extract concatenated text from a base64-encoded PDF using pdf.js.
  async function extractPdfText(base64Data) {
    const pdfjsLib = await loadPdfjs();
    const raw = atob(base64Data);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
    let out = '';
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      out += tc.items.map(it => it.str).join(' ') + '\n';
    }
    return out.trim();
  }

  // Map of fileKey -> filename for PDFs only (used by "Summarize all").
  window.pdfFilenames = window.pdfFilenames || {};
  // Per-target in-flight guard to avoid concurrent clicks on the same PDF.
  const _summaryInFlight = {};

  // Summarize a single PDF; renders inline beneath the row. Returns true on success.
  // The raw (unescaped) filename is looked up from window.pdfFilenames[key];
  // callers pass only the key so no user-controlled string is interpolated into
  // inline onclick attributes or double-escaped.
  window.summarizePdf = async function (key) {
    const target = document.getElementById('summary-' + key);
    if (!target) return false;
    const filename = (window.pdfFilenames && window.pdfFilenames[key]) || 'unknown';
    if (_summaryInFlight[key]) return false;
    _summaryInFlight[key] = true;

    const base64 = window.fileDataStore[key];
    if (!base64) {
      target.innerHTML = '<span class="summary-error ocs__status-pill ocs__status-pill--bad">Error: file data not found.</span>';
      _summaryInFlight[key] = false;
      return false;
    }

    target.innerHTML = '<span class="summary-loading ocs__text">Summarizing…</span>';

    let text;
    try {
      text = await extractPdfText(base64);
    } catch (err) {
      console.error('extractPdfText failed:', err);
      target.innerHTML = '<span class="summary-error ocs__status-pill ocs__status-pill--bad">Could not read PDF — try again.</span>';
      _summaryInFlight[key] = false;
      return false;
    }

    if (!text || !text.trim()) {
      target.innerHTML = '<span class="summary-error ocs__status-pill ocs__status-pill--bad">No extractable text (scanned PDF?)</span>';
      _summaryInFlight[key] = false;
      return false;
    }

    try {
      const res = await fetch(API_BASE + '/api/sfi/pdf-summary', {
        ...fetchOptions,
        method: 'POST',
        body: JSON.stringify({ filename, text })
      });

      if (res.status === 401 || res.status === 403) {
        target.innerHTML = '<span class="summary-error ocs__status-pill ocs__status-pill--bad">Sign in to summarize.</span>';
        return false;
      }

      if (!res.ok) {
        let msg = 'Could not summarize — try again';
        try {
          const errData = await res.json();
          if (errData && errData.message) msg = errData.message;
        } catch (_) { /* ignore parse errors */ }
        target.innerHTML =
          `<span class="summary-error ocs__status-pill ocs__status-pill--bad">${escapeHtmlSafe(msg)}</span> ` +
          `<button class="ocs__btn small" onclick="summarizePdf('${key}')">Retry</button>`;
        return false;
      }

      const data = await res.json();
      target.innerHTML = renderSummary(data.summary || '(no summary returned)');
      return true;
    } catch (err) {
      console.error('summarizePdf fetch failed:', err);
      target.innerHTML =
        '<span class="summary-error ocs__status-pill ocs__status-pill--bad">Could not summarize — try again</span> ' +
        `<button class="ocs__btn small" onclick="summarizePdf('${key}')">Retry</button>`;
      return false;
    } finally {
      _summaryInFlight[key] = false;
    }
  };

  // Summarize every PDF in the store sequentially, rendering each as it returns.
  window.summarizeAllPdfs = async function () {
    const btn = document.getElementById('summarize-all-btn');
    const status = document.getElementById('summarize-all-status');
    const keys = Object.keys(window.pdfFilenames || {});

    if (!keys.length) {
      if (status) status.textContent = 'No PDFs found';
      return;
    }

    if (btn) btn.disabled = true;
    let done = 0;
    for (const key of keys) {
      done++;
      if (status) status.textContent = `Summarizing ${done}/${keys.length}…`;
      try {
        await window.summarizePdf(key);
      } catch (err) {
        console.error('summarizeAllPdfs item failed:', err);
      }
    }
    if (status) status.textContent = `Done (${keys.length} PDF${keys.length === 1 ? '' : 's'})`;
    if (btn) btn.disabled = false;
  };

  // Wait for DOM to be fully loaded
  document.addEventListener('DOMContentLoaded', async function () {
    console.log("Admin panel script loaded.");

    async function getCredentials() {
      try {
        const res = await fetch(`${pythonURI}/api/id`, fetchOptions);

        if (res.ok) {
          const data = await res.json();
          const role = data.role;
          console.log(role);
          return role;
        } else {
          console.log(`Request failed for with status ${res.status}`);
        }
      } catch (err) {
        console.log(`Error: ${err}`);
      }
    }

    async function getGrades() {
      try {
        const res = await fetch(`${javaURI}/api/grades`, fetchOptions );

        if (res.ok) {
          const data = await res.json();
          console.log("In get grades function", data)
          return data;
        } else {
          console.log(`Request failed for with status ${res.status}`);
        }
      } catch (err) {
        console.log(`Error: ${err}`);
      }
    }

    const role = await getCredentials();
    const grades = await getGrades();

    // Admin panel open/close logic
    const adminPanel = document.getElementById('admin-panel');
    const adminFab = document.getElementById('admin-toggle-btn');
    const adminCloseBtn = document.getElementById('admin-close-btn');

    if (adminFab && adminPanel && adminCloseBtn) {
      adminFab.addEventListener('click', function () {
        adminPanel.showModal();
        adminFab.hidden = true;
        console.log("Admin panel opened.");
        console.log("Role:", role);
        console.log("Grades:", grades);

        // Show a message if the current user is not an admin
        const container = document.getElementById('admin-container') || document.getElementById('admin-modal-content');

        if (!role || String(role) !== 'Admin') {
          container.innerHTML = '<p class="ocs__callout alert-red">This admin panel is only available to admin users.</p>';
          return;
        }

        // If user is admin, render a 7-column table (UID, Assignment, Score, Classes, Content, Notes, Link)
        if (role && String(role) === 'Admin') {
          // small helper to escape HTML
          function escapeHtml(str) {
            return String(str || '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&#039;');
          }

          const container = document.getElementById('admin-container') || document.getElementById('admin-modal-content');
          if (!container) {
            console.warn('No admin container found to render admin table.');
            return;
          }

          // Define openPdfViewer function globally
          window.fileDataStore = {}; // Store file data here

          window.openPdfViewer = function (key, filename) {
            const base64Data = window.fileDataStore[key];
            if (!base64Data) {
              alert('Error: File data not found.');
              return;
            }

            const viewerWindow = window.open('', '_blank');
            if (viewerWindow) {
              const htmlContent = `
                <!DOCTYPE html>
                <html>
                <head>
                  <title>PDF Viewer - ${filename}</title>
                  <style>
                    body { margin: 0; background-color: #525659; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
                    .header { width: 100%; background: #333; color: white; padding: 10px; text-align: center; font-family: sans-serif; position: sticky; top: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 100; }
                    .pdf-page { margin: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.5); background: white; display: block; }
                    #pdf-container { display: flex; flex-direction: column; align-items: center; width: 100%; }
                  </style>
                </head>
                <body>
                  <div class="header">
                    <h2>Viewing: ${filename}</h2>
                  </div>
                  <div id="pdf-container"></div>
                  
                  <script type="module">
                    import * as pdfjsLib from 'https://mozilla.github.io/pdf.js/build/pdf.mjs';
                    
                    try {
                        var pdfData = atob('${base64Data}');
                        
                        // Set worker source
                        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://mozilla.github.io/pdf.js/build/pdf.worker.mjs';

                        var loadingTask = pdfjsLib.getDocument({data: pdfData});
                        loadingTask.promise.then(function(pdf) {
                          console.log('PDF loaded with ' + pdf.numPages + ' pages');
                          var container = document.getElementById('pdf-container');
                          
                          // Render all pages
                          for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                              // Create canvas for each page immediately to maintain order
                              const canvas = document.createElement('canvas');
                              canvas.className = 'pdf-page';
                              container.appendChild(canvas);
                              
                              // Fetch and render the page
                              pdf.getPage(pageNum).then(function(page) {
                                console.log('Page ' + pageNum + ' loaded');
                                
                                var scale = 1.5;
                                var viewport = page.getViewport({scale: scale});

                                var context = canvas.getContext('2d');
                                canvas.height = viewport.height;
                                canvas.width = viewport.width;

                                var renderContext = {
                                  canvasContext: context,
                                  viewport: viewport
                                };
                                var renderTask = page.render(renderContext);
                                renderTask.promise.then(function () {
                                  console.log('Page ' + pageNum + ' rendered');
                                });
                              });
                          }
                        }, function (reason) {
                          console.error(reason);
                          document.body.innerHTML += '<p style="color:red; text-align:center; background:white; padding:10px;">Error loading PDF: ' + reason + '</p>';
                        });
                    } catch (e) {
                        console.error(e);
                        document.body.innerHTML += '<p style="color:red; text-align:center; background:white; padding:10px;">Error processing PDF data: ' + e.message + '</p>';
                    }
                  <\/script>
                </body>
                </html>
              `;
              viewerWindow.document.write(htmlContent);
              viewerWindow.document.close();
            } else {
              alert('Please allow popups to view the PDF.');
            }
          };

          // Function to download base64 file
          window.downloadBase64File = function (key, filename) {
            const base64Data = window.fileDataStore[key];
            if (!base64Data) {
              alert('Error: File data not found.');
              return;
            }

            // Simple mime type inference
            let mimeType = 'application/octet-stream';
            if (filename.endsWith('.png')) mimeType = 'image/png';
            else if (filename.endsWith('.jpg') || filename.endsWith('.jpeg')) mimeType = 'image/jpeg';
            else if (filename.endsWith('.txt')) mimeType = 'text/plain';

            const byteCharacters = atob(base64Data);
            const byteNumbers = new Array(byteCharacters.length);

            for (let i = 0; i < byteCharacters.length; i++) {
              byteNumbers[i] = byteCharacters.charCodeAt(i);
            }

            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: mimeType });

            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            a.click();

            URL.revokeObjectURL(url);
          };

          const rows = (Array.isArray(grades) ? grades : []).map((g, rowIndex) => {
            // Format content column
            let contentHtml = '';
            if (Array.isArray(g.content)) {
              contentHtml = g.content.map((c, contentIndex) => {
                const rawFilename = c.filename || 'unknown';
                const filename = escapeHtml(rawFilename);
                const isPdf = filename.toLowerCase().endsWith('.pdf');
                const filePreview = c.file ? escapeHtml(c.file.substring(0, 10)) : '';

                let fileDisplay = `<span>${filename} (${filePreview})</span>`;

                if (c.file) {
                  // Generate unique key
                  const fileKey = `file_${g.uid || g.studentId}_${rowIndex}_${contentIndex}`;
                  // Store full base64 data
                  window.fileDataStore[fileKey] = c.file;

                  if (isPdf) {
                    // Record this PDF for the "Summarize all" loop. Store the raw
                    // (unescaped) filename; summarizePdf escapes only at HTML
                    // insertion and posts the raw value to the backend.
                    window.pdfFilenames[fileKey] = rawFilename;
                    fileDisplay += `
                        <button onclick="openPdfViewer('${fileKey}', '${filename}')" class="ocs__btn small" title="View PDF">View
                        </button>
                        <button onclick="summarizePdf('${fileKey}')" class="ocs__btn small" title="Summarize PDF">Summarize</button>
                       `;
                  } else {
                    // Download button for other file types
                    fileDisplay += `
                        <button onclick="downloadBase64File('${fileKey}', '${filename}')" class="ocs__btn small" title="Download File">Download
                        </button>
                       `;
                  }
                }

                // fileKey is only defined when c.file exists; build a stable
                // summary target id keyed by it so summaries render inline.
                const summaryTargetId = c.file ? `file_${g.uid || g.studentId}_${rowIndex}_${contentIndex}` : '';
                const summaryTarget = summaryTargetId
                  ? `<div class="pdf-summary-target" id="summary-${summaryTargetId}"></div>`
                  : '';
                return `<div><div class="ocs__links">${fileDisplay}</div>${summaryTarget}</div>`;
              }).join('');
            }

            // Helper to create safe CSS ID from string
            function safeId(str) {
              return String(str || '').replace(/[^a-zA-Z0-9-_]/g, '-');
            }

            // Format link column
            const linkHtml = g.link ? `<a href="${escapeHtml(g.link)}" target="_blank">${escapeHtml(g.link)}</a>` : '';

            return `\
            <tr>\
              <td>${escapeHtml(g.uid || g.studentId || '(unknown)')}</td>\
              <td>${escapeHtml(g.title || g.assignment)}</td>\
              <td id="score-${safeId(g.uid || g.studentId)}-${safeId(g.title || g.assignment)}">${escapeHtml(g.score)}</td>\
              <td>${escapeHtml(g.class || g.course || g.classes)}</td>\
              <td>${contentHtml}</td>\
              <td>${escapeHtml(g.notes)}</td>\
              <td>${linkHtml}</td>\
              <td>\
                <button class="ocs__btn small accent" onclick="openEditModal('${escapeHtml(g.uid)}', '${escapeHtml(g.title || g.assignment)}')">Edit</button>\
              </td>\
            </tr>\
          `}).join('');

          const tableHtml = `\
            <div id="pdf-summary-toolbar" class="ocs__links">\
              <button id="summarize-all-btn" class="ocs__btn accent fill" onclick="summarizeAllPdfs()">Summarize all PDFs</button>\
              <span id="summarize-all-status" class="ocs__text"></span>\
            </div>\
            <div class="ocs__table-wrap">\
            <table id="admin-table" class="ocs__table">\
              <thead>\
                <tr>\
                  <th>UID</th>\
                  <th>Assignment</th>\
                  <th>Score</th>\
                  <th>Classes</th>\
                  <th>Content</th>\
                  <th>Notes</th>\
                  <th>Link</th>\
                  <th>Actions</th>\
                </tr>\
              </thead>\
              <tbody>\
                ${rows}\
              </tbody>\
            </table>\
            </div>\
          `;

          container.innerHTML = tableHtml;

          // Define openEditModal function globally so it can be called from onclick
          window.openEditModal = async function (uid, title) {
            const score = prompt(`Enter new score for ${title} (UID: ${uid}):`);
            if (score !== null) {
              try {
                // Note: Trailing slash used based on previous fix experience
                const res = await fetch(`${javaURI}/api/grades`, {
                  ...fetchOptions,
                  method: "PUT",
                  body: JSON.stringify({
                    uid: uid,
                    title: title,
                    score: score
                  })
                });

                if (res.ok) {
                  alert('Score updated successfully!');
                  // Reconstruct the safe ID
                  const safeUid = String(uid || '').replace(/[^a-zA-Z0-9-_]/g, '-');
                  const safeTitle = String(title || '').replace(/[^a-zA-Z0-9-_]/g, '-');
                  const scoreCell = document.getElementById(`score-${safeUid}-${safeTitle}`);

                  if (scoreCell) {
                    scoreCell.innerText = score;
                  }
                } else {
                  alert(`Failed to update score: ${res.status}`);
                  console.error('Update failed', res);
                }
              } catch (err) {
                console.error('Error updating score:', err);
                alert('Error updating score: ' + err.message);
              }
            }
          };
        }
      });

      adminCloseBtn.addEventListener('click', function () {
        adminPanel.close();
      });
      adminPanel.addEventListener('close', function () {
        adminFab.hidden = false;
      });
    }
  });
</script>
