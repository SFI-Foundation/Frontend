<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    {% if page.sfi_redirect %}
    <meta http-equiv="refresh" content="0; url={{ page.sfi_redirect | relative_url }}">
    <link rel="canonical" href="{{ page.sfi_redirect | split: '#' | first | absolute_url }}">
    {% else %}
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    {% endif %}
    {% if page.sitemap == false %}<meta name="robots" content="noindex, nofollow">{% endif %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | SFI Foundation</title>
    <meta name="description" content="{{ page.description | default: 'SFI Foundation - Setting the Standard for Motorsports Safety Since 1978' }}">
    <link rel="icon" href="{{ '/images/sfi/favicon-32x32.png' | relative_url }}" sizes="32x32">
    <link rel="icon" href="{{ '/images/sfi/favicon-192x192.png' | relative_url }}" sizes="192x192">
    <link rel="apple-touch-icon" href="{{ '/images/sfi/apple-touch-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/sfi.css' | relative_url }}">
  </head>
  <body class="sfi-site{% if page.body_class %} {{ page.body_class | escape }}{% endif %}">
    <a class="sfi-skip-link" href="#sfi-main">Skip to content</a>
    {% include sfi/nav.html %}
    <main id="sfi-main" tabindex="-1">
      {{ content }}
    </main>
    {% include sfi/footer.html %}
    <script>
      const navToggle = document.getElementById('navToggle');
      const navLinks = document.getElementById('navLinks');

      navToggle.hidden = false;
      navLinks.classList.add('enhanced');

      function setNavOpen(open) {
        navLinks.classList.toggle('open', open);
        navToggle.setAttribute('aria-expanded', String(open));
        navToggle.setAttribute('aria-label', open ? 'Close navigation menu' : 'Open navigation menu');
      }

      navToggle.addEventListener('click', () => {
        setNavOpen(navToggle.getAttribute('aria-expanded') !== 'true');
      });
      navLinks.addEventListener('click', event => {
        if (event.target.closest('a')) setNavOpen(false);
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && navToggle.getAttribute('aria-expanded') === 'true') {
          setNavOpen(false);
          navToggle.focus();
        }
      });
      window.addEventListener('resize', () => {
        if (window.matchMedia('(min-width: 861px)').matches) setNavOpen(false);
      });
    </script>
  </body>
</html>
