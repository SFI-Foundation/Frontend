<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | SFI Foundation</title>
    <meta name="description" content="{{ page.description | default: 'SFI Foundation - Setting the Standard for Motorsports Safety Since 1978' }}">
    <link rel="icon" href="{{ '/images/sfi/favicon-32x32.png' | relative_url }}" sizes="32x32">
    <link rel="icon" href="{{ '/images/sfi/favicon-192x192.png' | relative_url }}" sizes="192x192">
    <link rel="apple-touch-icon" href="{{ '/images/sfi/apple-touch-icon.png' | relative_url }}">
    {% include sfi/styles.html %}
  </head>
  <body style="margin:0;padding:0;background:var(--sfi-bg,#f4f5f7);color:var(--sfi-text,#1a1d23);">
    <header class="sfi-header">
      <a href="/sfifoundation/" class="sfi-header-logo">
        <img src="{{ '/images/sfi/SFI-Logo.png' | relative_url }}" alt="SFI Foundation" class="sfi-logo-img">
      </a>
      <div class="sfi-header-tagline">Setting the Standard for<br>Motorsports Safety Since 1978.</div>
    </header>
    {% include sfi/nav.html %}
    <main>
      {{ content }}
    </main>
    {% include sfi/footer.html %}
    {% include sfi/chatbot.html %}
    <script>
      const navToggle = document.getElementById('navToggle');
      const navLinks = document.getElementById('navLinks');

      function setNavOpen(open) {
        navLinks.classList.toggle('open', open);
        navToggle.setAttribute('aria-expanded', String(open));
        navToggle.setAttribute('aria-label', open ? 'Close navigation menu' : 'Open navigation menu');
      }

      navToggle.addEventListener('click', () => {
        setNavOpen(navToggle.getAttribute('aria-expanded') !== 'true');
      });
      navLinks.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => setNavOpen(false));
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && navToggle.getAttribute('aria-expanded') === 'true') {
          setNavOpen(false);
          navToggle.focus();
        }
      });
      window.addEventListener('resize', () => {
        if (window.matchMedia('(min-width: 901px)').matches) setNavOpen(false);
      });
    </script>
  </body>
</html>
