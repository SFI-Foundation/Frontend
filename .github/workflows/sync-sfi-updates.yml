name: Refresh official SFI news and events
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read official SFI feed and meeting schedule
        run: python scripts/sync_sfi_updates.py
      - name: Commit content changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/sfi_updates.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh SFI public news and event schedule"
            git push
          fi
