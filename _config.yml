# SFI site identity and production deployment.
title: SFI Foundation
description: "Standards for the quality assurance of specialty performance and racing equipment."
owner_name: SFI Foundation
github_username: SFI-Foundation
github_repo: "Frontend"
url: "https://sfi.opencodingsociety.com"
baseurl: ""
future: true
encoding: utf-8
incremental: false

# Keep the existing theme available for legacy layouts. Public pages use sfi.
remote_theme: jekyll/minima
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

# Ordered source paths, resolved via page front matter by both headers.
# Authentication remains a separate, session-aware entry in the SFI header.
minima:
  skin: dark
  social_links:
    - { platform: github, user_url: "https://github.com/SFI-Foundation" }
  nav_pages:
    - navigation/about.md
    - navigation/sfi-specs.md
    - navigation/services.md
    - navigation/news-events.md

# Backend origin override; blank preserves existing environment resolution.
sfi_api_base: ""
# Prototype output requires development mode AND explicit opt-in.
sfi_manufacturer_demo: false

# Preserve credential, prototype, source and build artifact safeguards.
exclude:
  - .env
  - .env.*
  - _internal
  - qa-evidence
  - docs
  - scripts
  - tests
  - graphify-out
  - README.md
  - package.json
  - package-lock.json
  - vendor
  - Makefile
  - _notebooks
  - _docx
  - _projects
  - venv
  - sfifoundation.com
  - node_backend
